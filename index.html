<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1f2937"><link rel="manifest" href="./manifest.webmanifest"><title>Daily Performance Plan</title><style>
:root{--bg:#f6f7f8;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#1f2937;--blue:#2563eb;--red-bg:#fee2e2;--red:#991b1b;--yellow-bg:#fef3c7;--green-bg:#dcfce7;--purple-bg:#ede9fe;--shadow:0 8px 24px rgba(17,24,39,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;line-height:1.55}header{position:sticky;top:0;z-index:5;background:rgba(246,247,248,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:14px 12px 10px}h1{font-size:18px;margin:0}.sub{font-size:12px;color:var(--muted)}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}button{border:0;border-radius:999px;background:#e5e7eb;padding:9px;font-weight:700;color:#2563eb}button.active,.primary{background:var(--accent);color:#fff}.container{max-width:760px;margin:auto;padding:12px 12px 90px}.nav{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;margin:12px 0}.date{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff;font-weight:700}.card,.item{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0;box-shadow:var(--shadow)}.badge{display:inline-block;border-radius:999px;padding:4px 8px;margin:0 5px 6px 0;font-size:12px;font-weight:700;background:#eef2ff;color:#3730a3}.match{background:var(--red-bg);color:var(--red)}.trip{background:var(--yellow-bg);color:#92400e}.rec{background:var(--green-bg);color:#166534}.tap{background:var(--purple-bg);color:#5b21b6}.title{font-size:22px;font-weight:800}.muted{color:var(--muted);font-size:13px}h2{font-size:16px;margin:0 0 8px;border-left:4px solid var(--accent);padding-left:8px}.main{font-weight:800;font-size:16px}.block{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}.label{font-size:13px;font-weight:800;color:var(--accent);margin-bottom:2px}.pfc{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.pfc div{border:1px solid var(--line);border-radius:14px;text-align:center;padding:8px}.pfc b{display:block;font-size:18px}.meal{border-bottom:1px solid var(--line);padding:8px 0}.meal:last-child{border:0}.advice{background:#f9fafb;border:1px solid var(--line);border-radius:14px;padding:10px;margin-top:8px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}input,textarea{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:4px}textarea{min-height:76px}.list{display:grid;gap:8px}.item{margin:0}.row{display:flex;justify-content:space-between;gap:8px;font-weight:800}.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.95);border-top:1px solid var(--line);padding:8px 12px max(8px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.hidden{display:none}.toast{position:fixed;bottom:72px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;border-radius:999px;padding:10px 14px;opacity:0;transition:.2s}.toast.show{opacity:1}
</style></head><body><header><h1>Daily Performance Plan</h1><div class="sub">v3｜undefined修正・詳細メニュー対応</div><div class="tabs"><button data-tab="day" class="active">日別</button><button data-tab="week">7日</button><button data-tab="all">一覧</button><button data-tab="log">記録</button></div></header><main class="container">
<section id="day"><div class="nav"><button id="prev">← 前日</button><input id="picker" class="date" type="date"><button id="next">翌日 →</button></div><div id="dayView"></div></section>
<section id="week" class="hidden"><div class="card"><h2>今日から7日間</h2><div class="muted">日付をタップすると日別画面へ移動します。</div></div><div id="weekView" class="list"></div></section>
<section id="all" class="hidden"><div class="card"><h2>全日程一覧</h2><input id="search" placeholder="例：試合 / フットサル / 出張 / Zone2 / プロテイン"></div><div id="allView" class="list"></div></section>
<section id="log" class="hidden"><div class="card"><h2>入力済み記録</h2><div class="muted">この端末のブラウザ内に保存されます。</div></div><div id="logView" class="list"></div></section>
</main><div class="bottom"><button id="important">9/26へ</button><button id="nextMatch">次の試合</button><button id="copy">記録コピー</button></div><div id="toast" class="toast">保存しました</div><script src="./data.js"></script><script>
const plan=window.DAILY_PLAN||[],map=new Map(plan.map(x=>[x["日付"],x])),dates=plan.map(x=>x["日付"]);let cur=init();
function today(){let n=new Date();return`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`}
function init(){return map.has(today())?today():dates[0]}
function fmt(x){let d=new Date(x+"T00:00:00"),w=["日","月","火","水","木","金","土"][d.getDay()];return`${d.getMonth()+1}/${d.getDate()}（${w}）`}
function add(x,n){let d=new Date(x+"T00:00:00");d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function val(i,k,f=""){return (i && i[k]!==undefined && i[k]!==null && i[k]!=="" ) ? i[k] : f}
function key(x){return"daily-plan-v2-record-"+x}
function oldkey(x){return"daily-plan-record-"+x}
function rec(x){try{return JSON.parse(localStorage.getItem(key(x))||localStorage.getItem(oldkey(x))||"{}")}catch{return{}}}
function save(x,v){localStorage.setItem(key(x),JSON.stringify(v))}
function toast(t="保存しました"){let e=document.getElementById("toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1200)}
function cls(i){let s=(val(i,"予定区分")+" "+val(i,"トレーニング"));if(s.includes("試合"))return"match";if(s.includes("出張"))return"trip";if(s.includes("回復"))return"rec";if(s.includes("テーパー")||s.includes("前日"))return"tap";return""}
function renderDay(){let i=map.get(cur),r=rec(cur),v=document.getElementById("dayView");document.getElementById("picker").value=cur;if(!i){v.innerHTML='<div class="card">この日付のプランはありません。</div>';return}
const warm=val(i,"ウォームアップ",val(i,"詳細","表示データなし")),main=val(i,"メイン",val(i,"詳細","表示データなし")),strength=val(i,"補強","補強なし"),cool=val(i,"クールダウン","ストレッチ10分"),ad=val(i,"トレーニングアドバイス",val(i,"目的・注意","体調に合わせて調整。")),nut=val(i,"栄養アドバイス","総タンパク量を確保し、運動前後は消化に合わせて糖質＋プロテインを調整。");
v.innerHTML=`<div class="card"><span class="badge ${cls(i)}">${val(i,"予定区分")}</span><span class="badge">目標 ${val(i,"目標体重(kg)")}kg</span><span class="badge">${val(i,"強度目安","RPE -")}</span><div class="title">${fmt(cur)}</div><div class="muted">${val(i,"フェーズ")}</div></div>
<div class="card"><h2>トレーニング詳細</h2><div class="main">${val(i,"トレーニング")}</div><div class="block"><div class="label">ウォームアップ</div><div>${warm}</div></div><div class="block"><div class="label">メイン</div><div>${main}</div></div><div class="block"><div class="label">補強</div><div>${strength}</div></div><div class="block"><div class="label">クールダウン</div><div>${cool}</div></div><div class="advice"><div class="label">アドバイス</div>${ad}</div></div>
<div class="card"><h2>PFC目標</h2><div class="pfc"><div><span>P</span><b>${val(i,"P(g)")}g</b></div><div><span>F</span><b>${val(i,"F(g)")}g</b></div><div><span>C</span><b>${val(i,"C(g)")}g</b></div><div><span>kcal</span><b>${val(i,"目標kcal")}</b></div></div></div>
<div class="card"><h2>食事・補給</h2>${["朝食","昼食","補食","夕食"].map(k=>`<div class="meal"><div class="label">${k}</div><div>${val(i,k,"未設定")}</div></div>`).join("")}<div class="advice"><div class="label">栄養アドバイス</div>${nut}</div></div>
<div class="card"><h2>今日の記録</h2><div class="grid2"><label>実測体重 kg<input id="wt" inputmode="decimal" value="${r.weight||""}" placeholder="例：79.4"></label><label>実施チェック<input id="ck" value="${r.check||""}" placeholder="○ / △ / ×"></label></div><label>メモ<textarea id="memo" placeholder="疲労感、睡眠、痛み、食事の乱れなど">${r.memo||""}</textarea></label><button class="primary" id="save">保存</button> <button id="clear">クリア</button></div>`;
document.getElementById("save").onclick=()=>{save(cur,{weight:wt.value.trim(),check:ck.value.trim(),memo:memo.value.trim(),savedAt:new Date().toISOString()});renderLog();toast()};
document.getElementById("clear").onclick=()=>{localStorage.removeItem(key(cur));localStorage.removeItem(oldkey(cur));renderDay();renderLog();toast("クリアしました")}}
function item(iso,i){return`<div class="item" onclick="go('${iso}')"><div class="row"><span>${fmt(iso)}</span><span>${val(i,"予定区分")}</span></div><div class="muted">${val(i,"トレーニング")} / ${val(i,"強度目安","")}</div><div class="muted">P${val(i,"P(g)")} F${val(i,"F(g)")} C${val(i,"C(g)")} / ${val(i,"目標kcal")}kcal / 目標${val(i,"目標体重(kg)")}kg</div></div>`}
function renderWeek(){let a=[];for(let n=0;n<7;n++){let iso=add(cur,n),i=map.get(iso);if(i)a.push(item(iso,i))}weekView.innerHTML=a.join("")}
function renderAll(){let q=search.value.trim();allView.innerHTML=plan.filter(i=>!q||Object.values(i).join(" ").includes(q)).map(i=>item(i["日付"],i)).join("")}
function renderLog(){let a=[];for(let iso of dates){let r=rec(iso),p=map.get(iso);if(r.weight||r.check||r.memo)a.push(`<div class="item" onclick="go('${iso}')"><div class="row"><span>${fmt(iso)}</span><span>${r.check||""}</span></div><div class="muted">体重：${r.weight||"-"}kg / 目標：${val(p,"目標体重(kg)")}kg</div><div class="muted">${r.memo||""}</div></div>`)}logView.innerHTML=a.join("")||'<div class="card">まだ記録はありません。</div>'}
function go(x){if(!map.has(x))return;cur=x;tab("day");render();scrollTo(0,0)}
function tab(t){document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("active",b.dataset.tab==t));["day","week","all","log"].forEach(x=>document.getElementById(x).classList.toggle("hidden",x!=t))}
function render(){renderDay();renderWeek();renderAll();renderLog()}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{tab(b.dataset.tab);render()});prev.onclick=()=>go(add(cur,-1));next.onclick=()=>go(add(cur,1));picker.onchange=e=>go(e.target.value);search.oninput=renderAll;important.onclick=()=>go("2026-09-26");nextMatch.onclick=()=>{let n=plan.find(i=>val(i,"予定区分").includes("試合")&&i["日付"]>=cur)||plan.find(i=>val(i,"予定区分").includes("試合"));if(n)go(n["日付"])};copy.onclick=async()=>{let a=[];for(let iso of dates){let r=rec(iso);if(r.weight||r.check||r.memo)a.push({date:iso,...r})}let t=JSON.stringify(a,null,2);try{await navigator.clipboard.writeText(t);toast("記録をコピーしました")}catch{alert(t)}};if("serviceWorker"in navigator&&location.protocol!="file:")navigator.serviceWorker.register("./service-worker.js").catch(()=>{});render();
</script></body></html>
